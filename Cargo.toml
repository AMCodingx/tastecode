[workspace]
resolver = "2"
members = [
  "apps/native",
  "crates/harness-agent",
  "crates/harness-client",
  "crates/harness-adapter-codex",
  "crates/harness-proc",
  "crates/harness-protocol",
  "crates/harness-providers",
  "crates/harness-server",
  "crates/harness-state",
  "crates/harness-store",
  "crates/harness-terminal",
  "crates/harness-ui",
  "crates/harness-workspace",
]

[workspace.package]
edition = "2024"
rust-version = "1.91.1"
publish = false

[workspace.dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
anyhow = "1.0.100"
async-channel = "2.5.0"
base64 = "0.22.1"
chrono = "0.4.45"
cpal = "0.18.1"
dirs = "5.0.1"
gpui = "=0.2.2"
gpui-component = "=0.5.1"
headless_chrome = { version = "=1.0.22", default-features = false, features = ["offline"] }
libc = "0.2.189"
portable-pty = "=0.9.0"
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.17"
tungstenite = "0.30.0"
url = "2.5.8"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
